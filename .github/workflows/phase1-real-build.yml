name: Phase 1 Complete Market Memory Build

on:
  push:
    branches: [phase1-market-memory-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: phase1-market-memory-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Acquire complete Phase 1 historical evidence
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          HISTORICAL_START_DATE: "2021-08-12"
          HISTORICAL_END_DATE: "2026-08-12"
          HISTORICAL_OUTPUT_DIR: "research_data"
          HISTORICAL_REQUEST_DELAY: "0.25"
        run: python phase1_full_acquisition.py

      - name: Build Phase 1 Market Memory
        env:
          PSYCHO_RESEARCH_ROOT: "research_data"
          PSYCHO_MEMORY_ROOT: "phase1_memory"
        run: python phase1_market_memory.py

      - name: Validate complete Phase 1 build
        env:
          PSYCHO_RESEARCH_ROOT: "research_data"
          PSYCHO_MEMORY_ROOT: "phase1_memory"
        run: |
          python -m py_compile phase1_full_acquisition.py phase1_market_memory.py historical_downloader.py
          test -s research_data/acquisition_manifest.json
          test -s phase1_memory/manifest.json
          test -s phase1_memory/dataset_catalog.json
          test -s phase1_memory/session_memory.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('phase1_memory/manifest.json').read_text())
          a=json.loads(Path('research_data/acquisition_manifest.json').read_text())
          assert m['phase']=='PHASE_1_MARKET_MEMORY'
          assert a['acquisition']=='FULL'
          assert a['indices']==['NIFTY','BANKNIFTY']
          assert set(a['index_timeframes']) == {'1','5','15','60'}
          assert a['futures_timeframe']=='5'
          assert a['options_timeframe']=='5'
          assert len(a['options_strikes']) == 21
          assert set(a['options_expiry_flags']) == {'WEEK','MONTH'}
          assert m['dataset_count'] >= 10
          assert m['session_count'] > 0
          print('PHASE1_COMPLETE_BUILD_VALIDATION=PASS')
          print('DATASETS=', m['dataset_count'])
          print('SESSIONS=', m['session_count'])
          PY

      - name: Upload complete Phase 1 research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: psycho-phase1-complete-market-memory
          path: |
            research_data/
            phase1_memory/
          retention-days: 30
