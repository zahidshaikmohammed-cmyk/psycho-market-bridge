name: PSYCHO Batch 1 Historical Acquisition

on:
  push:
    paths:
      - 'historical_research_acquisition.py'
      - '.github/workflows/batch1-historical.yml'
  workflow_dispatch:

jobs:
  batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      BATCH1_FROM: '2025-08-11 09:15:00'
      BATCH1_TO: '2026-08-08 15:40:00'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Dhan secrets exist
        run: |
          test -n "$DHAN_CLIENT_ID" || (echo 'DHAN_CLIENT_ID secret missing' && exit 1)
          test -n "$DHAN_ACCESS_TOKEN" || (echo 'DHAN_ACCESS_TOKEN secret missing' && exit 1)
          echo 'Dhan runtime secrets detected.'
      - name: Run Batch 1 acquisition
        run: python historical_research_acquisition.py
      - name: Upload validated Batch 1 data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: psycho-batch1-underlying
          path: research_data/batch1_underlying/
          retention-days: 30
