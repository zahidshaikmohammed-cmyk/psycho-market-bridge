name: PSYCHO Batch 2B Expired Options Microstructure Acquisition

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  batch2b:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'RUN BATCH 2B'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      BATCH2B_FROM: '2025-08-11'
      BATCH2B_TO: '2026-08-09'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Verify Dhan secrets exist
        run: |
          test -n "$DHAN_CLIENT_ID"
          test -n "$DHAN_ACCESS_TOKEN"
      - name: Run Batch 2B acquisition
        run: python batch2b_expired_options_acquisition.py
      - name: Upload validated Batch 2B data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: psycho-batch2b-expired-options
          path: research_data/batch2b_expired_options/
          retention-days: 30
